# MirrorChyan is a third-party download mirror, off by default for new projects
# It only works once MirrorChyan has enabled the project; turning it on here alone does nothing
# https://mirrorchyan.com/

name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
#   release:
#     types: [published]

jobs:
  mirrorchyan:
    runs-on: macos-latest
    # MirrorChyan is a third-party download mirror, off by default for new projects
    # It only works once MirrorChyan has enabled the project; turning it on here alone does nothing
    # https://mirrorchyan.com/
    if: false
    # if: ${{ github.repository_owner == 'MaaXYZ' }}
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MaaSxS-{0}-{1}-*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MaaSxS
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: MaaXYZ
          repo: MaaSxS
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
