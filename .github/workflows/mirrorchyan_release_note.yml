# MirrorChyan is a third-party download mirror, off by default for new projects
# It only works once MirrorChyan has enabled the project; turning it on here alone does nothing
# https://mirrorchyan.com/

name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [edited] # [edited, published]

jobs:
  mirrorchyan:
    runs-on: macos-latest
    # MirrorChyan is a third-party download mirror, off by default for new projects
    # It only works once MirrorChyan has enabled the project; turning it on here alone does nothing
    # https://mirrorchyan.com/
    if: false
    # if: ${{ github.repository_owner == 'MaaXYZ' }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MaaSxS
          version_name: ${{ inputs.tag }}

          owner: MaaXYZ
          repo: MaaSxS
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
