# Release notes for GitHub releases, generated by git-cliff in install.yml.
[remote.github]
owner = "stevenoctopus"
repo = "MaaSxS"

[changelog]
header = """
# Changelog
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} \
        {% if commit.github.username %} @{{ commit.github.username }}{% else %} {{ commit.author.name }}{% endif %}
        {%- if commit.footers -%}
            {%- for footer in commit.footers -%}
                {%- if footer.token == "Co-authored-by" -%}
                    {%- set co_author_name = footer.value | split(pat=" <") | first | trim %} @{{ co_author_name }}
                {%- endif -%}
            {%- endfor -%}
        {%- endif %}
{% endmacro -%}

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## New contributors ❤️
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{%- endif %}
"""

footer = """
"""

[git]
conventional_commits = true # group commits by conventional-commit prefix
filter_unconventional = false # but keep commits without one
split_commits = false
protect_breaking_commits = false
commit_parsers = [
    # skip commits containing [skip changelog]
    { message = ".*\\[skip changelog\\].*", skip = true },
    { body = ".*\\[skip changelog\\].*", skip = true },
    { message = "^feat", group = "<!-- 0 -->✨ New features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
    { message = "^docs", group = "<!-- 4 -->📚 Docs" },
    { message = "^perf", group = "<!-- 3 -->🚀 Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactoring" },
    { message = "^style", group = "<!-- 5 -->🎨 Style" },
    { message = "^test", group = "<!-- 6 -->🧪 Tests" },
    { message = "^chore\\(deps\\)", group = "📦 Dependencies" },
    { message = "^chore", group = "<!-- 8 -->🔧 Maintenance" },
    { message = "^ci", group = "<!-- 7 -->⚙️ CI" },
    { body = ".*security", group = "<!-- 9 -->🔒 Security" },
    { message = "^revert", group = "<!-- 10 -->◀️ Reverts" },
    { message = ".*", group = "<!-- 11 -->Other changes" },
]

ignore_tags = "rc"
sort_commits = "oldest"

[git.github]
commits = true